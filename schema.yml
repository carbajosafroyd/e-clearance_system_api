          nullable: true
        system:
          allOf:
          - $ref: '#/components/schemas/System54bEnum'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        can_change:
          type: boolean
          readOnly: true
        bucket:
          type: string
          nullable: true
          readOnly: true
      required:
      - bucket
      - can_change
      - id
      - institute
      - institute_name
      - school_id
      - school_name
      - setting_key
      - setting_value
      - system
