  /api/v1/audit-logs/report/excel/:
    get:
      operationId: v1_audit_logs_report_excel_retrieve
      description: 'Sheets: Summary (filters and counts), Top Actors, Daily Activity,
        and Entries - the entry rows include the old/new value diffs as JSON strings.'
      summary: Audit log report (Excel)
      parameters:
      - in: query
        name: action
        schema:
          type: array
          items:
            type: string
            enum:
            - create
            - update
            - delete
            - cancel
            - approve
            - reject
        description: 'What was done to the entity. Accepts multiple values: repeat
          the parameter (`?action=a&action=b`) or send them comma-separated (`?action=a,b`).
          Values are OR-ed together; unknown values are rejected with a 400.'
        explode: true
        style: form
      - in: query
        name: actor
        schema:
          type: string
        description: 'Search the acting user by name: matches username, first name
          and last name, case-insensitively. Multiple words must all match (each against
          any of the three fields), so `actor=juan cruz` finds Juan Cruz. Use this
          instead of guessing `actor_id`.'
      - in: query
        name: actor_id
        schema:
          type: integer
        description: Exact id of the acting user, when it is already known (e.g. drilling
          into one user's trail from another screen).
      - in: query
        name: actor_type
        schema:
          type: array
          items:
            type: string
            enum:
            - student
            - staff
            - system
            - admin
        description: 'What kind of account acted. Accepts multiple values: repeat
          the parameter (`?actor_type=a&actor_type=b`) or send them comma-separated
          (`?actor_type=a,b`). Values are OR-ed together; unknown values are rejected
          with a 400.'
        explode: true
        style: form
      - in: query
        name: date_from
        schema:
          type: string
        description: Only entries created on or after this date (YYYY-MM-DD).
      - in: query
        name: date_to
        schema:
          type: string
        description: Only entries created on or before this date (YYYY-MM-DD).
      - in: query
        name: entity_id
        schema:
          type: string
        description: Exact primary key of the entity the entry is about.
      - in: query
        name: entity_type
        schema:
          type: array
          items:
            type: string
        description: 'Model name(s) the entry is about, matched case-insensitively
          - e.g. `Payment`, `Fee`, `GeneratedFeeBatch`, `FeeExemptedStudent`. Accepts
          multiple values: repeat the parameter (`?entity_type=a&entity_type=b`) or
          send them comma-separated (`?entity_type=a,b`). Values are OR-ed together;
          unknown values are rejected with a 400.'
        explode: true
        style: form
        examples:
