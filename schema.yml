        description: Exact primary key of the entity the entry is about.
      - in: query
        name: entity_type
        schema:
          type: array
          items:
            type: string
        description: 'Model name(s) the entry is about, matched case-insensitively
          - e.g. `Payment`, `Fee`, `GeneratedFeeBatch`, `FeeExemptedStudent`. Accepts
          multiple values: repeat the parameter (`?entity_type=a&entity_type=b`) or
          send them comma-separated (`?entity_type=a,b`). Values are OR-ed together;
          unknown values are rejected with a 400.'
        explode: true
        style: form
        examples:
          PaymentsAndFees:
            value: Payment,Fee
            summary: Payments and fees
      - in: query
        name: system
        schema:
          type: array
          items:
            type: string
            enum:
            - collection
            - locker
            - attendance
            - voting
            - clearance
            - platform
        description: 'Originating system of the entries. Accepts multiple values:
          repeat the parameter (`?system=a&system=b`) or send them comma-separated
          (`?system=a,b`). Values are OR-ed together; unknown values are rejected
          with a 400.'
        explode: true
        style: form
      tags:
      - Audit Log
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
