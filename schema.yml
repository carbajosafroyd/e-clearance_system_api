    PatchedCollectionCategoryCreate:
      type: object
      properties:
        category_name:
          type: string
          maxLength: 150
        collection_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description:
          type: string
          nullable: true
    PatchedComplaintWrite:
      type: object
      description: |-
        Filing one, and editing it while nobody has answered.

        `status`, `response` and the handled_* fields are absent on purpose: a
        student cannot mark their own complaint resolved, and an officer changes
        it through the resolve/reject actions, which are the ones that notify.
      properties:
        id:
          type: integer
          readOnly: true
        system:
          allOf:
          - $ref: '#/components/schemas/System54bEnum'
          description: |-
            Which system this is about. It decides who reads it.

            * `collection` - Collection Management System
            * `locker` - Locker Management System
            * `attendance` - Attendance Management System
            * `clearance` - Clearance Management System
            * `voting` - Voting System
            * `platform` - Platform
        category:
          $ref: '#/components/schemas/CategoryE96Enum'
        related_fee:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 150
        description:
          type: string
        attachments: {}
    PatchedContributionWrite:
      type: object
      description: |-
        Student-facing create/update.

        `student`, `status` and `points_awarded` are not writable: the student is
        taken from the request, and the other two only move through the review
        actions.
      properties:
        id:
          type: integer
          readOnly: true
        system:
          allOf:
          - $ref: '#/components/schemas/System54bEnum'
          description: |-
            Which system this is about. Points are earned in that system.

            * `collection` - Collection Management System
            * `locker` - Locker Management System
            * `attendance` - Attendance Management System
            * `clearance` - Clearance Management System
            * `voting` - Voting System
            * `platform` - Platform
        kind:
          $ref: '#/components/schemas/Kind2efEnum'
        impact:
          allOf:
          - $ref: '#/components/schemas/ImpactEnum'
          description: |-
            Set by the student, confirmed or corrected by the reviewer.

            * `low` - Low
            * `medium` - Medium
            * `high` - High
            * `critical` - Critical
        title:
          type: string
          maxLength: 150
        description:
          type: string
        attachments: {}
    PatchedCouponBatchRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          description: What this run was for, e.g. 'IC Week 2026 raffle'.
        reason:
          type: string
          readOnly: true
          description: Why it was given, e.g. 'Quiz bee, 2nd place'.
        kind:
          allOf:
          - $ref: '#/components/schemas/Kind812Enum'
          readOnly: true
        value_type:
          allOf:
          - $ref: '#/components/schemas/ValueTypeEnum'
          readOnly: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Pesos when fixed, percent when percent.
        value_label:
          type: string
          readOnly: true
        max_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        categories:
          type: array
