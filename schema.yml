    UserInvite:
      type: object
      description: |-
        One invitation, placed somewhere in the org chart.

        ## Who may invite whom

        `group_id` is checked against `delegable_roles(request.user)` - the
        `DELEGATION` table in `api/rbac/roles.py`. Before that check the
        queryset was every group in the database, so anyone holding
        `users.invite_user` (an institute-level grant) could post
        `group_id=<School Admins>` and mint an account two levels above their
        own. The console had the same table on its side and could only hide the
        option; this is what closes it. The refusal names what the caller MAY
        invite, because DRF's own "invalid pk" would send them looking for a
        seeding problem that does not exist.

        ## Where the account lands

        The token records the school and institute the account will belong to,
        and `RegisterSerializer` copies them onto the account at activation:

            School Admins    `school_id` names the school. Superusers only - a
                             school administrator never appoints a peer. The
                             account is school-wide and has no institute; the
                             school is what `api/rbac/scoping.py` reads.
            anything else    `institute_id` names the institute. A school
                             administrator picks one in their own school; an
                             institute administrator's own institute is used,
                             and naming a different one is refused rather than
                             silently replaced.
      properties:
        email:
          type: string
          format: email
        group_id:
          type: integer
        school_id:
          type: integer
          nullable: true
        institute_id:
          type: integer
          nullable: true
        student_school_id:
          type: string
      required:
      - email
      - group_id
    UserRead:
      type: object
      description: |-
        Detailed schema for retrieving ONE account (`GET /users/{id}/`).

        This is the only user serializer that renders roles. It used to send
        `group_id` / `group_name` taken from `obj.groups.first()`, which was a
        quiet lie: an account genuinely can hold several groups (a school
        administrator who also signs clearances), and "first" is decided by row
        id, so the role it reported changed depending on the order the groups
        were seeded in. The console then showed one role and the assign-roles
        dialog risked stripping the ones it could not see.

        `groups` is the whole set. The list endpoint deliberately does NOT carry
        it - see `UserReadSlimSerializer`.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        institute:
          $ref: '#/components/schemas/InstituteReadSlim'
        school:
          $ref: '#/components/schemas/SchoolReadSlim'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupSlim'
          readOnly: true
        group_count:
          type: integer
          readOnly: true
        pending_email_change:
          allOf:
          - $ref: '#/components/schemas/PendingEmailChange'
          nullable: true
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        profile:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - date_joined
      - email
      - first_name
      - group_count
      - groups
      - id
      - institute
      - is_active
      - is_staff
      - is_superuser
      - last_login
      - last_name
      - pending_email_change
      - profile
      - school
      - updated_at
      - updated_by
      - username
    UserReadSlim:
      type: object
      description: |-
        Row schema for the list (`GET /users/`).

        No roles here - only how many there are. Rendering the group names on
        every row meant a prefetch of the M2M for a page of accounts, and the
        consumer (the console's account table) only ever displayed one of them
        anyway, so the column was both expensive and misleading. The count is
        enough to see who has no role yet, which is the thing the list is scanned
        for; the full set is one click away on the retrieve endpoint.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        institute:
          $ref: '#/components/schemas/InstituteReadSlim'
        school:
          $ref: '#/components/schemas/SchoolReadSlim'
        group_count:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        profile:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - group_count
      - id
      - institute
      - is_active
      - last_name
      - profile
      - school
      - username
    UserUpdate:
      type: object
      description: Schema for updates
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        profile:
          type: string
          format: uri
          writeOnly: true
          nullable: true
        remove_profile:
          type: boolean
          writeOnly: true
          default: false
        profile_url:
          type: string
          readOnly: true
      required:
      - profile_url
      - username
    ValueTypeEnum:
      enum:
      - fixed
      - percent
      type: string
      description: |-
        * `fixed` - Fixed amount
        * `percent` - Percentage
    VisibilityEnum:
      enum:
      - public
      - followers
      - private
      type: string
      description: |-
        * `public` - Public
        * `followers` - Followers
        * `private` - Private
    Wallet:
      type: object
      properties:
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/WalletEntry'
        total_balance:
          type: integer
        total_earned:
          type: integer
        total_spent:
          type: integer
        approved_contributions:
          type: integer
        pending_contributions:
          type: integer
        discount_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        rank:
          type: integer
          nullable: true
      required:
      - approved_contributions
      - discount_total
      - pending_contributions
      - rank
      - total_balance
      - total_earned
      - total_spent
      - wallets
    WalletEntry:
      type: object
      properties:
        system:
          type: string
        label:
          type: string
        balance:
          type: integer
        total_earned:
          type: integer
        total_spent:
          type: integer
      required:
      - balance
      - label
      - system
      - total_earned
      - total_spent
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
