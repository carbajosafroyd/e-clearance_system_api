    post:
      operationId: v1_exempted_fee_students_bulk_create
      description: Exempt many students at once from one category for a term. Send
        `student_school_ids` plus the shared `category`, `reason`, `academic_year`
        and `semester`. Unknown or out-of-institute school IDs reject the whole request;
