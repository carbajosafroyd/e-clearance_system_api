      description: |-
        ViewSet for handling user notifications.
        Provides high-performance filtering, safe side-effect read marks.
      parameters:
      - in: query
        name: broadcast
        schema:
          type: integer
      - in: query
        name: created_from
        schema:
          type: string
          format: date
      - in: query
        name: created_to
        schema:
          type: string
          format: date
      - name: current_page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: is_read
        schema:
          type: boolean
      - name: per_page
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - auth
          - collection
          - complaints
          - enrollment
          - finance
          - submissions
          - system
        description: |-
          * `collection` - Collection Management System
          * `finance` - Finance System
          * `enrollment` - Enrollment System
          * `submissions` - Submissions System
          * `auth` - Authentication System
          * `complaints` - Complaints
          * `system` - System
      - in: query
        name: source__in
        schema:
          type: array
          items:
            type: string
            enum:
            - auth
            - collection
            - complaints
            - enrollment
            - finance
            - submissions
            - system
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: type
        schema:
          type: string
          enum:
          - complaint.acknowledged
          - complaint.rejected
          - complaint.resolved
          - fees.pending
          - payment.approved
          - payment.rejected
          - system.announcement
        description: |-
          * `fees.pending` - Pending Fees
          * `payment.approved` - Payment Approved
          * `payment.rejected` - Payment Rejected
          * `system.announcement` - System Announcement
          * `complaint.acknowledged` - Complaint Acknowledged
          * `complaint.resolved` - Complaint Resolved
          * `complaint.rejected` - Complaint Closed
      - in: query
        name: type__in
        schema:
          type: array
          items:
            type: string
            enum:
            - complaint.acknowledged
            - complaint.rejected
            - complaint.resolved
            - fees.pending
            - payment.approved
            - payment.rejected
            - system.announcement
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationListList'
          description: ''
