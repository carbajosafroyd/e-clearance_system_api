          description: ''
  /api/v1/summaries/admin-dashboard/:
    get:
      operationId: v1_summaries_admin_dashboard_retrieve
      description: |-
        Dashboard and summary widgets.

        Two audiences share this viewset: the back-office widgets, which read
        institute-wide totals, and the four `student-*` actions, which read only
        the caller's own figures. The table below is what keeps them apart -
        without it a student's token would reach the institute-wide numbers.
      parameters:
      - in: query
        name: academic_year
        schema:
          enum:
          - 2022-2023
          - 2023-2024
          - 2024-2025
          - 2025-2026
          - 2026-2027
          type: string
          minLength: 1
        description: |-
          * `2022-2023` - 2022-2023
          * `2023-2024` - 2023-2024
          * `2024-2025` - 2024-2025
          * `2025-2026` - 2025-2026
          * `2026-2027` - 2026-2027
        required: true
      - in: query
        name: semester
        schema:
          enum:
          - 1st
          - 2nd
          type: string
          minLength: 1
        description: |-
          * `1st` - First Semester
          * `2nd` - Second Semester
        required: true
      tags:
      - Summaries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryFilter'
          description: ''
  /api/v1/summaries/by-program-set/:
    get:
      operationId: v1_summaries_by_program_set_retrieve
      description: |-
        Program -> year level -> set -> student -> fees, with the same totals
        shape at every level, each level summing exactly to its parent.
      summary: Collections by program, year level and set
      parameters:
      - in: query
        name: academic_year
        schema:
          enum:
          - 2022-2023
          - 2023-2024
          - 2024-2025
          - 2025-2026
          - 2026-2027
          type: string
          minLength: 1
        description: |-
          Ignored when a date range is given.

          * `2022-2023` - 2022-2023
          * `2023-2024` - 2023-2024
          * `2024-2025` - 2024-2025
          * `2025-2026` - 2025-2026
          * `2026-2027` - 2026-2027
      - in: query
        name: compare_previous
        schema:
          type: boolean
          default: false
        description: Fill previous_total_collections with the same total over the
          window immediately before this one.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Overrides academic_year / semester when present.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Overrides academic_year / semester when present.
      - in: query
        name: program__name
        schema:
          type: string
        description: Program name, exactly as it appears in filter_options.programs.
      - in: query
        name: s_set
        schema:
          type: string
        description: Student set, matched exactly.
      - in: query
        name: semester
        schema:
          enum:
          - 1st
          - 2nd
          type: string
          minLength: 1
        description: |-
          Ignored when a date range is given.

          * `1st` - First Semester
          * `2nd` - Second Semester
      - in: query
        name: year_level
        schema:
          type: integer
          minimum: 1
        description: Student year level (Student.s_lvl), matched exactly.
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramSetReport'
          description: ''
