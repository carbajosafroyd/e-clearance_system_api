          description: ''
  /api/v1/exempted-fee-students/bulk-delete/:
    post:
      operationId: v1_exempted_fee_students_bulk_delete_create
      description: Remove many exemptions at once by their record ids (the ids the
        list endpoint returns). Ids that match nothing in your institute scope - already
        deleted, or never yours - are skipped and reported under `skipped_missing`,
        so re-posting the same selection is safe. Requires the *delete* permission
        on fee exemptions even though the request is a POST. The whole batch is written
        to the audit log as one entry.
      tags:
      - Fee Exempted Student
      requestBody:
        content:
