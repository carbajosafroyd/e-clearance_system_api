        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: per_page
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: program_id
        schema:
          type: number
      - in: query
        name: program_name
        schema:
          type: string
      - in: query
        name: reason
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: semester
        schema:
          type: string
          enum:
