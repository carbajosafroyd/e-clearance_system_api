  /api/v1/audit-logs/:
    get:
      operationId: v1_audit_logs_list
      description: |-
        One row per recorded change, newest first, with the acting user's username and full name resolved from the users table (`actor_username` / `actor_full_name`, null for system entries or deleted users).

        All filters combine with AND; the multi-value ones (`system`, `action`, `actor_type`, `entity_type`) OR their own values together, so `?action=create,delete&system=collection` reads as *(create OR delete) AND collection*. Responses are cached per query-string until the next audit write.

        For aggregate views of the same data (counts by action/system/actor, daily activity, PDF/Excel exports) use `/audit-logs/report/` and its `/pdf/` and `/excel/` variants, which take exactly the same filter parameters.
      summary: List audit log entries
      parameters:
      - in: query
        name: action
        schema:
          type: array
          items:
            type: string
            enum:
            - create
            - update
            - delete
            - cancel
            - approve
            - reject
        description: 'What was done to the entity. Accepts multiple values: repeat
          the parameter (`?action=a&action=b`) or send them comma-separated (`?action=a,b`).
          Values are OR-ed together; unknown values are rejected with a 400.'
        explode: true
        style: form
      - in: query
        name: actor
        schema:
          type: string
        description: 'Search the acting user by name: matches username, first name
          and last name, case-insensitively. Multiple words must all match (each against
          any of the three fields), so `actor=juan cruz` finds Juan Cruz. Use this
          instead of guessing `actor_id`.'
      - in: query
        name: actor_id
        schema:
          type: integer
        description: Exact id of the acting user, when it is already known (e.g. drilling
          into one user's trail from another screen).
      - in: query
        name: actor_type
        schema:
          type: array
          items:
            type: string
            enum:
            - student
            - staff
            - system
            - admin
        description: 'What kind of account acted. Accepts multiple values: repeat
          the parameter (`?actor_type=a&actor_type=b`) or send them comma-separated
          (`?actor_type=a,b`). Values are OR-ed together; unknown values are rejected
          with a 400.'
        explode: true
        style: form
      - in: query
        name: current_page
        schema:
          type: integer
        description: Page number (project pagination convention).
      - in: query
        name: date_from
        schema:
          type: string
        description: Only entries created on or after this date (YYYY-MM-DD).
      - in: query
        name: date_to
        schema:
          type: string
        description: Only entries created on or before this date (YYYY-MM-DD).
      - in: query
        name: entity_id
        schema:
          type: string
        description: Exact primary key of the entity the entry is about.
      - in: query
        name: entity_type
        schema:
          type: array
          items:
            type: string
        description: 'Model name(s) the entry is about, matched case-insensitively
          - e.g. `Payment`, `Fee`, `GeneratedFeeBatch`, `FeeExemptedStudent`. Accepts
          multiple values: repeat the parameter (`?entity_type=a&entity_type=b`) or
          send them comma-separated (`?entity_type=a,b`). Values are OR-ed together;
          unknown values are rejected with a 400.'
        explode: true
        style: form
        examples:
          PaymentsAndFees:
            value: Payment,Fee
            summary: Payments and fees
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: per_page
        schema:
          type: integer
        description: Page size (project pagination convention).
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: system
        schema:
          type: array
          items:
            type: string
            enum:
            - collection
            - locker
            - attendance
            - voting
            - clearance
            - platform
        description: 'Originating system of the entries. Accepts multiple values:
          repeat the parameter (`?system=a&system=b`) or send them comma-separated
          (`?system=a,b`). Values are OR-ed together; unknown values are rejected
          with a 400.'
        explode: true
        style: form
      tags:
      - Audit Log
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogReadSlimList'
          description: ''
