          type: array
          items:
            $ref: '#/components/schemas/DetailedFeesCategory'
          description: Sorted by category name.
        totals:
          $ref: '#/components/schemas/ReportTotals'
        payments:
          allOf:
          - $ref: '#/components/schemas/DetailedPaymentsSection'
