  /api/v1/users/{id}/change-email/:
    post:
      operationId: v1_users_change_email_create
      description: |-
        POST `{new_email}`: an administrator starts an email change for an account in their scope. A one-time confirmation link is mailed to the NEW address and nothing to the old one - this is for the person whose old mailbox is lost, for whom the self-service flow (a code to the current address first) can never complete. The account's email does not change until that link is opened; until then the detail endpoint reports it under `pending_email_change`. Posting again, with the same or another address, replaces the pending change with a fresh link - that is how a resend works.

        DELETE: cancel whatever change is pending; the emailed link stops working.

        Same scope and rank rules as `set-password`: only accounts in the caller's institute (or school, for a school administrator), never the caller's own, never a superuser's, and a school administrator's only by another school administrator.
      summary: Point an account at a new email address, or cancel a pending change
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEmailChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminEmailChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminEmailChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Link sent, or change cancelled
        '400':
          description: Address invalid, already used, or the account is deactivated
        '403':
          description: The target is outside what the caller may change
    delete:
      operationId: v1_users_change_email_destroy
      description: |-
        POST `{new_email}`: an administrator starts an email change for an account in their scope. A one-time confirmation link is mailed to the NEW address and nothing to the old one - this is for the person whose old mailbox is lost, for whom the self-service flow (a code to the current address first) can never complete. The account's email does not change until that link is opened; until then the detail endpoint reports it under `pending_email_change`. Posting again, with the same or another address, replaces the pending change with a fresh link - that is how a resend works.

        DELETE: cancel whatever change is pending; the emailed link stops working.

        Same scope and rank rules as `set-password`: only accounts in the caller's institute (or school, for a school administrator), never the caller's own, never a superuser's, and a school administrator's only by another school administrator.
      summary: Point an account at a new email address, or cancel a pending change
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Link sent, or change cancelled
        '400':
          description: Address invalid, already used, or the account is deactivated
        '403':
          description: The target is outside what the caller may change
  /api/v1/users/{id}/send-password-reset/:
    post:
      operationId: v1_users_send_password_reset_create
      description: Starts the same one-time-code flow as the public `password-reset/request/`
        endpoint, for an account in the caller's scope. The code goes to the account's
        own email address and is never returned here; the person finishes the reset
        themselves on any of the platform's sign-in screens. Same scope and rank rules
        as `set-password`.
      summary: Email a password reset code to another user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Code sent
        '400':
          description: The account has no email or is deactivated
        '403':
          description: The target is outside what the caller may reset
  /api/v1/users/{id}/set-password/:
    post:
      operationId: v1_users_set_password_create
      description: |-
        An administrator resets the password of an account in their scope - the person has forgotten theirs and cannot use `change-password`, which needs the current one.

        Scope is the same as the list: a superuser reaches any account, institute staff only the accounts of their own institute (anything else is a 404, not a 403, so the route does not confirm that an account exists outside the caller's institute). On top of that a caller may not reset their own password here, a superuser's, or that of anyone in a more senior role than their own.

        Every refresh token the account holds is blacklisted, so a session that was open somewhere else is ended too - if the reason for the reset was a compromised account, a reset that left the old session signed in would not have helped.
      summary: Set another user's password
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminSetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminSetPassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password set
        '400':
          description: Validation error
        '403':
          description: The target is outside what the caller may reset
  /api/v1/users/{id}/set-scope/:
    post:
      operationId: v1_users_set_scope_create
      description: '`{institute_id}` attaches the account to that institute (and to
        its school); `{school_id}` alone makes it school-level with no institute -
        what a school administrator''s account looks like. Superusers may place any
        account anywhere; a school administrator only within their own school. Everything
        the account sees follows from this, so an account that shows empty lists is
        usually one that was never placed.'
      summary: Move an account to a school or an institute
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetScope'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetScope'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetScope'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
          description: ''
        '403':
          description: Outside the caller's authority
  /api/v1/users/change-password/:
    post:
      operationId: v1_users_change_password_create
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Validation error
