        always cover everything the filters matched; only `records` is capped - `summary.records_truncated`
        says when.'
      summary: Audit log report
      parameters:
      - in: query
        name: action
        schema:
          type: array
          items:
            type: string
            enum:
            - create
            - update
            - delete
            - cancel
