      - fee_count
      - outstanding
      - overdue_count
      - paid_count
      - pending_count
      - waived_count
    CollectionReportDiscrepancies:
      type: object
      properties:
        count:
          type: integer
        difference:
          type: number
          format: double
          description: Sum of the signed differences.
        shortfall:
          type: number
          format: double
          description: Sum of the positive differences only - fees drawn down with
            no payment behind the drawdown. This is the part that counts into total_losses.
        records:
          type: array
          items:
            $ref: '#/components/schemas/CollectionReportDiscrepancyRecord'
      required:
      - count
      - difference
      - records
      - shortfall
    CollectionReportDiscrepancyRecord:
      type: object
      properties:
        fee_id:
          type: integer
        category:
          type: string
        student_number:
          type: string
        student_name:
          type: string
        status:
          type: string
        total_amount:
          type: number
          format: double
        discount_total:
          type: number
          format: double
          description: Relief recorded on the fee.
        balance:
          type: number
          format: double
        fee_paid:
          type: number
          format: double
          description: 'total_amount - discount_total - balance: what the fee says
            was paid off. Relief is subtracted because it is a drawdown with no payment
            behind it, and this figure is compared against payments.'
        payments_total:
          type: number
          format: double
          description: Sum of the fee's active payments.
        approved_submission_total:
          type: number
          format: double
          description: Sum of the fee's approved submission items, for cross-checking
            a submission that was approved but never became a payment.
        difference:
          type: number
          format: double
          description: fee_paid - payments_total; positive means missing payments.
      required:
      - approved_submission_total
      - balance
      - category
      - difference
      - discount_total
      - fee_id
      - fee_paid
      - payments_total
      - status
      - student_name
      - student_number
      - total_amount
    CollectionReportFilterOptions:
      type: object
      properties:
        programs:
          type: array
          items:
            type: string
        staff:
          type: array
          items:
            type: string
      required:
      - programs
      - staff
    CollectionReportKpi:
      type: object
      properties:
        total_collections:
          type: number
          format: double
          description: Active payments only, and only on fees that are not waived
            - money received on a later-waived fee is reported under losses.waived.collected_before_waive
            instead.
        previous_total_collections:
          type: number
          format: double
          nullable: true
          description: Null unless compare_previous was sent, and also null when there
            is no comparable window - never a stand-in zero.
        total_outstanding:
          type: number
          format: double
          description: Unpaid balance on fees that are actually owed; waived fees
            excluded.
        cash:
          type: number
          format: double
        gcash:
          type: number
          format: double
        top_category:
          type: string
          nullable: true
          description: Best collection rate, not the largest amount.
        top_category_rate:
          type: number
          format: double
          description: Percentage, e.g. 85.5.
      required:
      - cash
      - gcash
      - previous_total_collections
      - top_category
      - top_category_rate
      - total_collections
      - total_outstanding
    CollectionReportLosses:
      type: object
      description: |-
        Money that will never arrive, and money that does not add up.

        `waived` lists every waived fee: the loss is the forgiven remainder, not
        the whole bill. `discrepancies` is a per-fee reconciliation of the fee's
        own arithmetic (total_amount - balance) against its active payments - a
        mismatch means money moved outside the payment flow.
      properties:
        waived:
          $ref: '#/components/schemas/CollectionReportWaivedLosses'
        discrepancies:
          $ref: '#/components/schemas/CollectionReportDiscrepancies'
        total_losses:
          type: number
          format: double
          description: waived.waived_amount + discrepancies.shortfall - forgiven money
            plus money given away unrecorded.
      required:
      - discrepancies
      - total_losses
      - waived
