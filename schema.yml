  /api/v1/admin/student-bulk-invitations/template/:
    get:
      operationId: v1_admin_student_bulk_invitations_template_retrieve
      description: The blank spreadsheet, for handing to students to fill in.
      summary: Download the student invitation spreadsheet template
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/admin/student-bulk-invitations/upload/:
    post:
      operationId: v1_admin_student_bulk_invitations_upload_create
      description: 'Multipart: `file` (.xlsx or .csv with `email` and optional `student_school_id`
        columns - download the template from `admin/student-bulk-invitations/template/`),
        `dry_run` and `skip_invalid` as `true`/`false`. Every row is validated: email
        format and uniqueness, student ID belongs to the caller''s institute and has
        no account yet, no duplicates within the file. A dry run answers 200 with
        the rows and sends nothing; a real run answers 201 with the rows and `queued`,
        or 400 with the rows when some are invalid and `skip_invalid` is off.'
      summary: Invite students from an uploaded spreadsheet
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                dry_run:
                  type: boolean
                skip_invalid:
                  type: boolean
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '201':
          description: No response body
        '400':
          description: Unusable file or invalid rows
