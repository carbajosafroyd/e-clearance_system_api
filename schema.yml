  /api/v1/auth/google/:
    post:
      operationId: v1_auth_google_create
      description: |-
        Exchanges a Google ID token for this API's access/refresh pair.

        Sign-in only — it never creates an account. Refusals carry a `code` so the client can respond usefully:

        - `no_account` — verified, but no account holds that address. The response echoes the `email` so the UI can name it.
        - `account_inactive` — the account was deactivated.
        - `email_not_verified` — invited but never activated.
        - `token_expired` / `invalid_token` — retry is worth it for the first, not the second.
        - `google_not_configured` / `google_unreachable` — our fault, 503.
      summary: Google login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          description: Unusable token, or no account for that address
        '403':
          description: Account deactivated or not activated
        '503':
          description: Google sign-in unavailable
  /api/v1/auth/google/register:
    post:
      operationId: v1_auth_google_register_create
      description: Creates a user using a Google ID token.
      summary: Google account for registration
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
