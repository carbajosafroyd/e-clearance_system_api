openapi: 3.0.3
info:
  title: DNSC SYSTEMS API
  version: 1.0.0
  description: This API powers the backend for our system.
  contact:
    url: https://www.facebook.com/dnscicsa
    email: alexarnaizaparece@gmail.com
  license:
    name: MIT
paths:
  /api/v1/access/assign/:
    post:
      operationId: v1_access_assign_create
      description: |-
        Replace a user's roles with the given list.

        Bounded two ways for everyone but a superuser. The target must be in the caller's scope - their own institute, or their whole school for a school administrator - and is reported as not found otherwise, the same answer a missing id gets. And only the roles the caller's own role hands out (`DELEGATION` in `api/rbac/roles.py`) may be added or removed: any other role the account holds must be sent back unchanged, or the request is refused naming it. So an institute administrator can make one of their people a collection-desk admin, and cannot make anyone a school administrator - or strip that from one.
      tags:
      - Access Control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignRole'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccess'
          description: ''
  /api/v1/access/features/:
    get:
      operationId: v1_access_features_list
      description: Which optional modules your institute runs. A module the build
        does not ship has no routes at all, so this is how a client tells a missing
        feature apart from a missing permission.
      tags:
      - Access Control
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'
          description: ''
  /api/v1/access/me/:
