  /api/v1/transfer_token/issue/:
    post:
      operationId: v1_transfer_token_issue_create
      description: Issues a short-lived, single-use transfer token for the currently
        authenticated user. Hand this token to another system (sharing the same user
        database) so it can be exchanged there for a fresh access/refresh pair, without
        the user logging in again. The token expires after `TRANSFER_TOKEN_TTL_SECONDS`
        (default 60s) and can only be redeemed once.
      summary: Issue a transfer token
      tags:
      - Transfer Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTokenIssueRequest'
            examples:
              RequestExample:
                value:
                  intended_for: system-b
                summary: Request example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransferTokenIssueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransferTokenIssueRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferTokenIssueResponse'
              examples:
                ResponseExample:
                  value:
                    transfer_token: iHEQSnYwUs5pb1x65nYLb2ccGgP1Ll4KXuN-ZrG0p6aFwuMhfNQn3o4f0uNIZwLA
                    expires_at: '2026-06-18T10:15:11.970038Z'
                  summary: Response example
          description: Transfer token issued successfully.
        '401':
          description: Authentication credentials were not provided or are invalid.
  /api/v1/transfer_token/redeem/:
    post:
      operationId: v1_transfer_token_redeem_create
      description: Exchanges a previously issued transfer token for a fresh JWT access/refresh
        pair belonging to the same user. No Authorization header is required — the
        transfer token itself is the credential. The token is invalidated immediately
        on redemption, so it can never be used twice, and will be rejected if it has
        already expired.
      summary: Redeem a transfer token
      tags:
      - Transfer Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTokenRedeemRequest'
            examples:
              RequestExample:
                value:
                  transfer_token: iHEQSnYwUs5pb1x65nYLb2ccGgP1Ll4KXuN-ZrG0p6aFwuMhfNQn3o4f0uNIZwLA
                summary: Request example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransferTokenRedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransferTokenRedeemRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferTokenRedeemResponse'
              examples:
                SuccessResponse:
                  value:
                    refresh: eyJhbGciOiJIUzI1NiIs...
                    access: eyJhbGciOiJIUzI1NiIs...
                  summary: Success response
          description: Transfer token redeemed successfully; new JWT pair issued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferTokenErrorResponse'
              examples:
                AlreadyUsed:
                  value:
                    transfer_token:
                    - This transfer token has already been used.
                  summary: Already used
                Expired:
                  value:
                    transfer_token:
                    - This transfer token has expired.
                Invalid:
                  value:
                    transfer_token:
                    - Invalid transfer token.
          description: Transfer token is invalid, expired, or has already been used.
