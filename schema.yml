          type: integer
        name:
          type: string
          maxLength: 100
        authorizing_role:
          type: integer
        order_sequence:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
    PatchedClearanceTypeWrite:
      type: object
