      description: 'Upload an Excel workbook (.xlsx - the layout the export and the
        template produce: one sheet per status, `student_id`, `last_name`, `first_name`,
        `program` as the acronym, `year_level`...) or a CSV with the same columns.
        Rows are matched on `student_id` within the caller''s institute: an existing
        student is UPDATED, a new one is CREATED, and an id that belongs to another
        institute is refused. Answers 200 whatever happened; read the per-row `created`,
        `updated` (with what changed), `unchanged` and `failed` lists. A student whose
        record changed and who has an account is notified of the change.'
      summary: Import or update students from a spreadsheet
