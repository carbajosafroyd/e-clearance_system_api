      description: |-
        Bulk removal of exemptions by their record ids (the ids the list
        endpoint returns), so a screen can delete exactly the rows the user
        ticked.

        Ids that do not exist - or belong to another institute, which looks
        identical from the caller's side - are skipped and reported rather than
        failing the request, which makes re-posting the same selection safe:
        the second call simply finds nothing left to delete.
      properties:
        ids:
          type: array
          items:
            type: integer
            minimum: 1
          description: FeeExemptedStudent record ids to delete.
          maxItems: 500
      required:
      - ids
    FeeExemptedStudentBulkDeleteResult:
      type: object
      description: Response shape for the bulk delete endpoint.
      properties:
        deleted_count:
          type: integer
        skipped_count:
          type: integer
        deleted:
          type: array
          items:
            type: integer
          description: Ids that existed in your scope and were removed.
        skipped_missing:
          type: array
          items:
            type: integer
          description: Ids that matched nothing (already deleted, or outside your
            institute).
      required:
      - deleted
      - deleted_count
      - skipped_count
      - skipped_missing
    FeeExemptedStudentBulkResult:
      type: object
      description: Response shape for the bulk exemption endpoint.
      properties:
        created_count:
          type: integer
        skipped_count:
          type: integer
        created:
          type: array
          items:
            type: string
        skipped_existing:
          type: array
          items:
            type: string
      required:
      - created
      - created_count
      - skipped_count
      - skipped_existing
    FeeExemptedStudentBulkWrite:
      type: object
      description: |-
        Bulk variant of FeeExemptedStudentWriteSerializer: one category / reason /
        term applied to a whole list of students in a single request.

        Unknown or out-of-institute school IDs fail the request as a whole, so a
        typo can't silently exempt only half the list. Students already exempted
        for that category and term are skipped and reported, which makes re-posting
        the same list safe.
      properties:
        student_school_ids:
          type: array
          items:
            type: string
          maxItems: 500
        category:
          type: integer
        reason:
          type: string
          maxLength: 100
        academic_year:
          $ref: '#/components/schemas/AcademicYearEnum'
        semester:
          $ref: '#/components/schemas/SemesterEnum'
      required:
      - academic_year
      - category
      - reason
      - semester
      - student_school_ids
