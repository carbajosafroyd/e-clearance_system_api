{% comment %}
Shared shell for every transactional email.

Rules that keep these readable in Gmail, Outlook and Apple Mail alike:
tables for layout, inline styles only (no <style> block survives Gmail's
clipping reliably), a 600px card, and no external CSS or webfonts.

Blocks a message may fill:
  title      — the <title>, defaults to the brand name
  preheader  — the grey preview line in the inbox list. Always set it.
  eyebrow    — small uppercase label above the heading
  heading    — the one-line "what this email is"
  content    — the body
  footer_note— replaces the default "you can ignore this" line

Branding (`brand_name`, `brand_logo_url`, `brand_color`, …) comes from
core.services.email_branding.email_brand(), merged in by the sender, so the
header names the school the mail was sent on behalf of.
{% endcomment %}<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <title>{% block title %}{{ brand_name }}{% endblock %}</title>
</head>

<body
    style="margin:0; padding:0; width:100%; background-color:#eef1f5; -webkit-font-smoothing:antialiased; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

    <div
        style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent; height:0; width:0; mso-hide:all;">
        {% block preheader %}{% endblock %}
        &#847;&zwnj;&nbsp;&#8199;&shy;&#847;&zwnj;&nbsp;&#8199;&shy;&#847;&zwnj;&nbsp;&#8199;&shy;&#847;&zwnj;&nbsp;&#8199;&shy;
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
        style="background-color:#eef1f5;">
        <tr>
            <td align="center" style="padding:32px 12px;">

                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                    style="width:100%; max-width:600px;">

                    <!-- brand header -->
                    <tr>
                        <td align="center" style="padding:0 8px 20px;">
                            {% if brand_logo_url %}
                            <img src="{{ brand_logo_url }}" width="44" height="44" alt=""
                                style="display:block; margin:0 auto 10px; width:44px; height:44px; border-radius:10px; border:0; object-fit:cover;">
                            {% endif %}
                            <div
                                style="font-size:15px; font-weight:700; color:#0f172a; letter-spacing:-0.01em; line-height:1.4;">
                                {{ brand_name }}
                            </div>
                            {% if institute_name %}
                            <div style="font-size:12px; color:#64748b; margin-top:2px;">{{ institute_name }}</div>
                            {% endif %}
                        </td>
                    </tr>

                    <!-- card -->
                    <tr>
                        <td
                            style="background-color:#ffffff; border:1px solid #e2e8f0; border-radius:14px; overflow:hidden;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td
                                        style="height:4px; line-height:4px; font-size:0; background-color:{{ brand_color|default:'#04932a' }};">
                                        &nbsp;</td>
                                </tr>
                                <tr>
                                    <td style="padding:36px 36px 32px;">
                                        <div
                                            style="font-size:11px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:{{ brand_color|default:'#04932a' }};">
                                            {% block eyebrow %}{% endblock %}
                                        </div>
                                        <h1
                                            style="margin:8px 0 0; font-size:22px; line-height:1.3; font-weight:700; color:#0f172a; letter-spacing:-0.02em;">
                                            {% block heading %}{% endblock %}
                                        </h1>

                                        {% block content %}{% endblock %}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- footer -->
                    <tr>
                        <td style="padding:20px 24px 0; text-align:center;">
                            <p style="margin:0 0 8px; font-size:12px; line-height:1.6; color:#64748b;">
                                {% block footer_note %}
                                This is an automated message — please don't reply to it.
                                {% endblock %}
                            </p>
                            {% if support_email %}
                            <p style="margin:0 0 8px; font-size:12px; line-height:1.6; color:#64748b;">
                                Need help? Contact <a href="mailto:{{ support_email }}"
                                    style="color:#475569; text-decoration:underline;">{{ support_email }}</a>.
                            </p>
                            {% endif %}
                            <p style="margin:0; font-size:11px; color:#94a3b8;">
                                &copy; {{ year }} {{ brand_name }}
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
