{% comment %}
One label / value line inside a details panel.

    {% include "email_templates/partials/_row.html" with label="New address" value=new_email strong=True %}
{% endcomment %}
<tr>
    <td
        style="padding:7px 0; font-size:12px; color:#64748b; white-space:nowrap; vertical-align:top; width:38%;">
        {{ label }}
    </td>
    <td
        style="padding:7px 0; font-size:13px; color:{% if strong %}#0f172a{% else %}#334155{% endif %}; font-weight:{% if strong %}700{% else %}500{% endif %}; word-break:break-word; text-align:right;">
        {{ value }}
    </td>
</tr>
