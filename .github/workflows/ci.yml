name: Django CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_ENV: local
      USE_SQLITE: "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-for-automated-testing-12345"
      PASSWORD_PEPPER_1: "ci-test-password-pepper-value-should-be-at-least-48-chars"
      PASSWORD_PEPPER_CURRENT_VERSION: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: System Diagnostics & OpenAPI Validation
        run: |
          python manage.py check
          python manage.py spectacular --validate

      - name: Run Full Test Suite
        run: |
          python manage.py test
