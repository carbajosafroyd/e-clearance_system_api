name: Django CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate Production .env File
      env:
        PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      run: |
        printf '%s\n' "$PROD_ENV_FILE" > .env

    # Securely copy the newly built .env file to your server's application directory
    - name: Copy .env file to Server via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        source: ".env"
        target: "/home/${{ secrets.SSH_USER }}/${{ secrets.REMOTE_PATH }}/"

    # Execute the remote deploy script on the server
    - name: Execute Deployment Script over SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /home/${{ secrets.SSH_USER }}/${{ secrets.REMOTE_PATH }}
          ./deploy.sh